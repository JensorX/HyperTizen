name: Build HyperTizen TPK

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: '6.0.x'
  TIZEN_PLATFORM_PACKAGE: 'TIZEN-10.0-NativeAppDevelopment-CLI'
  TIZEN_STUDIO_URL: 'https://download.tizen.org/sdk/Installer/tizen-sdk_10.0/web-cli_Tizen_SDK_10.0_ubuntu-64.bin'
  TIZEN_SIGN_PROFILE: 'hypertizen-ci'
  PACKAGE_ID: io.gh.reisxd.HyperTizen

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Tizen .NET workload
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/Samsung/Tizen.NET/main/workload/scripts/workload-install.sh \
            | sudo env "PATH=$PATH" "DOTNET_ROOT=${DOTNET_ROOT:-}" bash
          dotnet workload list

      - name: Install Tizen Studio CLI
        shell: bash
        run: |
          set -euo pipefail
          TIZEN_STUDIO_HOME="$RUNNER_TEMP/tizen-studio"

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            openjdk-11-jre-headless \
            software-properties-common \
            unzip \
            zip
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3.8 libpython3.8

          installer="$RUNNER_TEMP/tizen-sdk-cli.bin"
          curl --fail --location --retry 3 --silent --show-error \
            "$TIZEN_STUDIO_URL" \
            --output "$installer"
          chmod +x "$installer"
          "$installer" --accept-license "$TIZEN_STUDIO_HOME"
          "$TIZEN_STUDIO_HOME/package-manager/package-manager-cli.bin" install \
            --accept-license "$TIZEN_PLATFORM_PACKAGE"

          export PATH="$TIZEN_STUDIO_HOME/tools/tizen-core:$TIZEN_STUDIO_HOME/tools/ide/bin:$PATH"
          echo "$TIZEN_STUDIO_HOME/tools/tizen-core" >> "$GITHUB_PATH"
          echo "$TIZEN_STUDIO_HOME/tools/ide/bin" >> "$GITHUB_PATH"
          tz --version

      - name: Determine package version
        shell: bash
        run: |
          set -euo pipefail

          manifest_version=$(sed -n 's/.*<manifest[^>]*[[:space:]]version="\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)".*/\1/p' HyperTizen/tizen-manifest.xml | head -n1)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            build_version="${GITHUB_REF_NAME#v}"
          else
            build_version="$manifest_version"
          fi

          if [[ ! "$build_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Tizen package version: $build_version" >&2
            exit 1
          fi

          echo "BUILD_VERSION=$build_version" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "RELEASE_SHA_SHORT=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "TPK_NAME=HyperTizen-${build_version}-${GITHUB_SHA:0:7}.tpk" >> "$GITHUB_ENV"
          echo "HYPERTIZEN_RELEASE=${RUNNER_TEMP}/hypertizen-release" >> "$GITHUB_ENV"
          echo "TIZEN_STUDIO_HOME=${RUNNER_TEMP}/tizen-studio" >> "$GITHUB_ENV"
          echo "TIZEN_AUTHOR_CERT=${RUNNER_TEMP}/hypertizen-author.p12" >> "$GITHUB_ENV"
          echo "TIZEN_PROFILES_XML=${RUNNER_TEMP}/hypertizen-profiles.xml" >> "$GITHUB_ENV"

      - name: Validate sources
        run: |
          set -euo pipefail
          git diff --check
          test -f HyperTizen/tizen-manifest.xml
          test -f HyperTizen/HyperTizen.csproj
          grep -q "package=\"${PACKAGE_ID}\"" HyperTizen/tizen-manifest.xml
          grep -q '<TargetFramework>tizen90</TargetFramework>' HyperTizen/HyperTizen.csproj

      - name: Apply package version
        shell: bash
        run: |
          set -euo pipefail

          sed -E -i \
            "s/(version=\")([0-9]+\.[0-9]+\.[0-9]+)/\1${BUILD_VERSION}/" \
            HyperTizen/tizen-manifest.xml

      - name: Prepare Tizen signing profile
        shell: bash
        env:
          TIZEN_AUTHOR_KEY: ${{ secrets.TIZEN_KEY || secrets.TIZEN_AUTHOR_KEY }}
          TIZEN_AUTHOR_KEY_PW: ${{ secrets.TIZEN_PW || secrets.TIZEN_AUTHOR_KEY_PW }}
        run: |
          set -euo pipefail
          : "${TIZEN_AUTHOR_KEY:?Missing repository secret TIZEN_KEY or TIZEN_AUTHOR_KEY}"
          : "${TIZEN_AUTHOR_KEY_PW:?Missing repository secret TIZEN_PW or TIZEN_AUTHOR_KEY_PW}"

          rm -f "$TIZEN_AUTHOR_CERT" "$TIZEN_PROFILES_XML"
          printf '%s' "$TIZEN_AUTHOR_KEY" | base64 --decode > "$TIZEN_AUTHOR_CERT"
          chmod 600 "$TIZEN_AUTHOR_CERT"

          tz security-profiles add \
            --name "$TIZEN_SIGN_PROFILE" \
            --active \
            --xml-path "$TIZEN_PROFILES_XML" \
            --author "$TIZEN_AUTHOR_CERT" \
            --password "$TIZEN_AUTHOR_KEY_PW"

          mkdir -p "$HOME/tizen-studio-data/profile"
          cp "$TIZEN_PROFILES_XML" "$HOME/tizen-studio-data/profile/profiles.xml"
          tizen cli-config --global "default.profiles.path=$TIZEN_PROFILES_XML"
          test -s "$TIZEN_PROFILES_XML"
          grep -q "$TIZEN_SIGN_PROFILE" "$TIZEN_PROFILES_XML"

      - name: Build and sign native service TPK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$HYPERTIZEN_RELEASE" "$GITHUB_WORKSPACE/HyperTizen/bin/Release"
          mkdir -p "$HYPERTIZEN_RELEASE"

          dotnet build HyperTizen/HyperTizen.csproj \
            --configuration Release \
            --nologo \
            -p:TizenCreateTpkOnBuild=true

          mapfile -t service_packages < <(find "$GITHUB_WORKSPACE/HyperTizen/bin/Release" -type f -name '*.tpk' -print)
          if [[ "${#service_packages[@]}" -ne 1 ]]; then
            printf 'Expected exactly one service TPK, found %s\n' "${#service_packages[@]}" >&2
            printf '%s\n' "${service_packages[@]}" >&2
            exit 1
          fi

          tpk_package="$HYPERTIZEN_RELEASE/$TPK_NAME"
          cp "${service_packages[0]}" "$tpk_package"
          tizen package \
            -t tpk \
            -s "$TIZEN_SIGN_PROFILE" \
            -- "$tpk_package"

          echo "TPK_PACKAGE=$tpk_package" >> "$GITHUB_ENV"
          test -s "$tpk_package"
          unzip -l "$tpk_package" | grep -q 'tizen-manifest.xml'
          unzip -l "$tpk_package" | grep -Eq 'author-signature.xml|signature1.xml'

      - name: Upload signed TPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TPK_NAME }}
          path: ${{ env.TPK_PACKAGE }}
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ env.RELEASE_SHA }}
          files: ${{ env.TPK_PACKAGE }}

      - name: Remove signing material
        if: always()
        run: rm -f "$TIZEN_AUTHOR_CERT" "$TIZEN_PROFILES_XML" "$HOME/tizen-studio-data/profile/profiles.xml"
